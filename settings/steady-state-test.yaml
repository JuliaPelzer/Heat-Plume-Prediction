# Minimal steady-state smoke config (1 epoch, 2 RUNs, tiny streamlines).
# Prep expects tests/heatplume_steady_smoke/datasets/dataset_giant_100hp_varyK
# with RUN_1, RUN_2 (+ inputs/) — created by the unittest helper.
# Full step2/3 on this 2560^2 / 100-HP dataset needs CUDA; the unittest runs step1-only on CPU.
run_configuration:
  run_name: steady_smoke
  dataset: dataset_giant_100hp_varyK
  seed: 2406
  device: cpu
  use_velocity_model: false

  pipeline:
    - clean: data_prep
    - clean: results-step1
    - clean: results-step2
    - step1: train
    - step2: run
    - clean: results-step3
    - step3: train

general_configuration:
  step1:
    datapoints:
      train: [0]
      validation: [1]
      test: [1]
    general:
      epochs: 1
      visualize: false
    scheduler:
      type: ReduceLROnPlateau
      init_lr: 1e-4
      mode: min
      factor: 0.2
      patience: 10
      threshold: 1e-3
      min_lr: 1e-6
    model_parameters:
      network: unet
      inputs: [p, k, i]
      outputs: [x, y]
      batchsize: 1
      kernel_size: 5
      depth: 2
      init_features: 8
      stride: 1
      dilation: 1
      norm: batchnorm
      repeat_inner: false
      skip_per_dir: 16
      len_box: 256
      train_loss: MSE
      bool_cutouts: false
      optimizer_switch: false
      optimizer: Adam
      activation: ReLU

  step2:
    streamlines:
      samples: 4
      steps: 4
      diffusion_scale: 0.05
      diffusion_base: 1.8
    rwpt:
      samples: 8
      steps: 4
    physical_parameters:
      resolution_m: 5.0
      duration_years: 27.5
      porosity_frac: 0.25
      rock_density_kg_per_m3: 2800.0
      rock_specific_heat_J_per_kgK: 2000.0
      water_density_kg_per_m3: 1000.0
      water_specific_heat_J_per_kgK: 4180.0
      thermal_conductivity_dry_W_per_mK: 0.65
      thermal_conductivity_wet_W_per_mK: 1.0
      thickness_aquifer_m: 1.0
      longitudinal_dispersivity_m: 1.0
      transverse_dispersivity_h_m: 0.1
      ambient_temperature_C: 10.6
      temperature_spread_C: 5.0
      injection_temperature_C:
        time_unit: year
        values:
          0.0: 15.6
          1.0: 15.6
      injection_rate_m3_per_s:
        time_unit: year
        values:
          0.0: 0.00024
          1.0: 0.00024

  step3:
    datapoints:
      train: [0]
      validation: [1]
      test: [1]
    general:
      epochs: 1
      visualize: false
    scheduler:
      type: ReduceLROnPlateau
      init_lr: 1e-3
      mode: min
      factor: 0.2
      patience: 10
      threshold: 1e-3
      min_lr: 1e-6
    model_parameters:
      network: unet
      inputs: [p, k, i, x, y, 1, 2, 3, 5, 7]
      outputs: [t]
      batchsize: 1
      kernel_size: 3
      depth: 2
      init_features: 8
      stride: 1
      dilation: 1
      norm: batchnorm
      repeat_inner: false
      skip_per_dir: 8
      len_box: 256
      train_loss: Huber
      bool_cutouts: false
      optimizer_switch: false
      optimizer: AdamW
      activation: LeakyReLU

paths:
  datasets_raw: ./tests/heatplume_steady_smoke/datasets
  datasets_prep: ./tests/heatplume_steady_smoke/datasets_prep
  results: ./tests/heatplume_steady_smoke/results
